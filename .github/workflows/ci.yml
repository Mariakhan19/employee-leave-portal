name: Employee Leave Portal CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Backend Build Check
        run: |
          cd backend
          echo "Backend Build Successful"

      - name: Frontend Check
        run: |
          cd frontend
          echo "Frontend Build Successful"
